# Manual teardown of everything this project created in AWS (only resources in its Terraform state).
# Actions -> destroy -> Run workflow -> type the environment name (e.g. sentinel-prod) to confirm.
name: destroy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type <project>-<environment> (e.g. sentinel-prod) to destroy it"
        required: true

concurrency:
  group: deploy-${{ vars.ENVIRONMENT || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      PROJECT: ${{ vars.PROJECT || 'sentinel' }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prod' }}
    steps:
      - name: Check confirmation
        if: inputs.confirm != format('{0}-{1}', env.PROJECT, env.ENVIRONMENT)
        run: echo "Confirmation does not match ${PROJECT}-${ENVIRONMENT}" && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: python scripts/ops.py down -y
