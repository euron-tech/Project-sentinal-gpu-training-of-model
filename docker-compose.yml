# ============================================================
# SENTINEL - docker-compose.yml
#
# Usage:
#   # Dry-run (data pipeline only)
#   docker compose run --rm sentinel --dry-run
#
#   # Full pipeline (fine-tune + evaluate)
#   docker compose run --rm sentinel --mode full
#
#   # Override individual settings
#   docker compose run --rm \
#     -e MODEL_NAME="Qwen/Qwen2.5-1.5B-Instruct" \
#     -e NUM_EPOCHS="5" \
#     sentinel --mode full
# ============================================================

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL=https://mdizvmguddpnvanfbegn.supabase.co
      - SUPABASE_KEY=sb_publishable_EUMi6FM_AdDt0zp71yfsNA_ntUEZArr
      - SUPABASE_BUCKET=sentinel-data
      - MODEL_NAME=Qwen/Qwen2.5-0.5B-Instruct
      - MAX_RECORDS=50000
      - NUM_EPOCHS=3
      - LR=2e-4
      - BATCH_SIZE=4
      - OUTPUT_DIR=/app/output/sentinel-lora
      - PYTHONUNBUFFERED=1
      # Set your Hugging Face token here for gated models:
      # - HUGGING_FACE_HUB_TOKEN=hf_...
    volumes:
      - ./output:/app/output
      - ./results:/app/results
    # CPU-only: no GPU passthrough needed
