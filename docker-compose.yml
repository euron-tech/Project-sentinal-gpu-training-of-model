# Each service builds from its own folder/Dockerfile and can be deployed on its own.
#   docker compose up -d --build                     # local pipeline: Kinesis emulator + stream scorer/producer (8003)
#                                                    #   + XGBoost API (8001) + dashboard (8501)
#   (AWS uses real Amazon Kinesis instead of the local emulator; traffic starts with "Start auto traffic" on Live Flow)
#   docker compose up -d --build xgboost ui          # just XGBoost API + dashboard
#   docker compose --profile gpu up -d --build llm   # GPU host (Hyperstack): LLM API (8000)
# Values come from .env in this folder (XGB_API_KEY, LLM_URL, LLM_API_KEY, SENTINEL_API_KEY, LLM_RUN ...).
services:
  xgboost:
    build: ./xgboost_benchmark
    image: sentinel-xgb
    ports: ["8001:8001"]
    env_file:
      - path: ./xgboost_benchmark/.env      # XGB_API_KEY (created by run_service.*)
        required: false
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-sentinel-data}
    volumes:
      - ./data/sft:/data/sft
    restart: unless-stopped

  kinesis:                                  # local Amazon Kinesis emulator (in memory; AWS uses real Kinesis)
    image: motoserver/moto:5.2.4
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  stream:                                   # auto-mode producer + Kinesis consumer -> models -> decision -> action,
                                            # analytics API + flow page
    build: ./stream
    image: sentinel-stream
    ports: ["8003:8003"]
    env_file:
      - path: ./xgboost_benchmark/.env      # XGB_API_KEY
        required: false
    environment:
      - KINESIS_ENABLED=1
      - KINESIS_ENDPOINT=http://kinesis:5000
      - KINESIS_CREATE=1                     # create the 3 streams in the emulator
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - XGB_URL=http://xgboost:8001
      - LORA_URL=${LORA_URL:-}
      - QLORA_URL=${QLORA_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - CHAMPION=${CHAMPION:-xgboost}
      - CONTROL_API_KEY=${CONTROL_API_KEY:-local-control-key}
      - EVENTS_PER_SEC=${EVENTS_PER_SEC:-2}
      - ATTACK_EVERY_S=${ATTACK_EVERY_S:-180}
      - PRODUCER_SOURCE=${PRODUCER_SOURCE:-synthetic}
      - AUTO_START=${AUTO_START:-0}
    volumes:
      - stream-data:/data
    depends_on:
      kinesis: {condition: service_healthy}
    restart: unless-stopped

  ui:
    build: ./ui
    image: sentinel-ui
    ports: ["8501:8501"]
    env_file:
      - path: ./xgboost_benchmark/.env      # same XGB_API_KEY as the xgboost service
        required: false
    environment:
      - LORA_URL=${LORA_URL:-${LLM_URL:-http://host.docker.internal:8000}}
      - QLORA_URL=${QLORA_URL:-http://host.docker.internal:8002}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - XGB_URL=${XGB_URL:-http://xgboost:8001}
      - STREAM_URL=http://stream:8003
      - PUBLIC_STREAM_URL=http://localhost:8003/live
      - CONTROL_API_KEY=${CONTROL_API_KEY:-local-control-key}
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  llm:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.llm
    image: sentinel-llm
    ports: ["8000:8000"]
    environment:
      - SENTINEL_API_KEY=${SENTINEL_API_KEY:-}
    volumes:
      - ./output:/app/output
      - ${HOME:-~}/.cache/huggingface:/root/.cache/huggingface
    command: ["--run", "output/${LLM_RUN:-latest}", "serve", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  stream-data:
